name: Neith dev verification

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-index:
    if: ${{ !contains(github.event.head_commit.message || '', '[grapher-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Go package
        run: go test ./...

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install browser dependencies
        working-directory: static/assets
        run: npm install --no-package-lock

      - name: Verify browser runtime
        working-directory: static/assets
        run: npm test

      - name: Build browser bundle
        working-directory: static/assets
        run: npm run build

      - name: Remove transient browser test output
        run: rm -rf static/assets/coverage

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install canonical Grapher
        run: python -m pip install 'git+https://github.com/seanbman/grapher.git@main'

      - name: Build and verify semantic repository index
        run: python scripts/index_grapher_dev.py

      - name: Commit generated browser and Grapher state
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- static/assets/neith.min.js .grapher/shared)" ]; then
            echo "Generated browser bundle and Grapher state are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/assets/neith.min.js .grapher/shared
          git commit -m "build: publish verified browser and Grapher state [grapher-generated]"
          git push
